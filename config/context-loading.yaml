#=============================================================================
# context-loading.yaml — 上下文加载策略
#
# 功能：定义每次任务启动时的上下文加载规则，包括强制入口文件、启动序列、
#       加载策略、上下文窗口管理、审计期望。
# 与 config/workspace_usage_guide.md 中的"强制启动序列"保持一致。
#
# 关联：
#   - config/workspace_usage_guide.md（Cline 行为标准）
#   - docs/model_context.md（项目全景入口）
#   - config/active-release.yaml（当前版本引用）
#   - docs/INDEX.md（文档索引）
#   - scripts/task_init_check.py（启动检查脚本）
#=============================================================================

context_loading:
  version: "0.1.0"
  status: "draft"
  mandatory_entrypoint:
    file: "docs/model_context.md"
    required_before:
      - "answering_project_level_questions"
      - "modifying_platform_assets"
      - "creating_or_updating_workflows"
      - "creating_or_updating_constraints"
      - "creating_or_updating_prompts"
      - "creating_or_updating_schemas"
      - "creating_or_updating_evaluators"
      - "proposing_implementation_plans"
  required_startup_sequence:
    - "docs/model_context.md"
    - "config/active-release.yaml"
    - "README.md"
    - "docs/current_workspace_creation_plan.md"
    - "constraints/baseline/context_intent_gate.yaml"
    - "config/workspace_usage_guide.md"
  startup_sequence_purpose: >
    每次任务启动时必须按顺序读取这些文件，以建立对项目全景、当前版本、治理规则和
    执行标准的统一理解。此序列与 config/workspace_usage_guide.md 中定义的
    "强制启动序列"保持一致。
    注意：docs/INDEX.md 是文档索引，按需查阅而非强制读取。
    当需要查找特定文档或确认文件用途时，应查阅 INDEX.md。
  on_missing_entrypoint: "block_and_report"
  loading_policy:
    mode: "layered_and_task_specific"
    rules:
      - "Load the mandatory entrypoint and active release manifest first."
      - "Load global governance context before task-specific workflow context."
      - "Load only relevant workflow, constraint, prompt, schema, evaluator, and metadata files."
      - "Do not load unrelated industry packages, jurisdictions, prompts, or tools."
      - "Summarize or run a second retrieval pass when context exceeds the task budget."
      - "Before executing regulated tasks (legal, finance, compliance), check the active knowledge_base_version and knowledge_bases list. If empty or marked draft, flag data freshness risk and offer online update."
      - "Every key finding in the output MUST be traceable to a specific source document, interview, or data record. Include source reference (document name, section, date) alongside each finding."
      - "Classify each finding with an evidence level: fact (directly from source), assumption (inferred but unverified), inference (logical deduction), or unknown (no supporting data)."
      - "When citing sources, include metadata: {source_doc, section, page_or_timestamp, retrieval_date} to enable audit trail."
      - "If a finding cannot be traced to a loaded source, flag it as 'insufficient_evidence' and include the reasoning in the output."
  context_window:
    max_tokens: 128000
    warning_threshold: 0.85
    critical_threshold: 0.95
    auto_summarize: true
    summarization_strategy: "remove_oldest_conversation_history"
    preserve_last_n_messages: 10
  audit_expectations:
    record_loaded_files: true
    record_skipped_relevant_files: true
    record_context_reasoning_summary: true
    record_freshness_check: true
    record_fetched_sources: true
    target_schema: "schemas/run_snapshot.schema.json"
