feature_flags:
  version: "0.1.0"
  status: "draft"
  flags:
    context_intent_gate:
      enabled: true
      rollout: "all_workflows"
    layered_context_loading:
      enabled: true
      rollout: "all_workflows"
    workflow_interruptions:
      enabled: true
      rollout: "all_workflows"
    strict_schema_outputs:
      enabled: true
      rollout: "all_workflows"
    human_review_gate:
      enabled: true
      rollout: "high_risk_actions"
    mcp_tool_registry:
      enabled: true
      rollout: "registered_tools_only"
    external_fetch:
      enabled: true
      rollout: "manual_approval_only"
      freshness_check:
        description: "When the active knowledge base is empty or outdated, the workflow may request user approval to fetch current official sources online."
        allowed_domains:
          - "pkulaw.com"
          - "gov.cn"
          - "pkulaw.com/law"
          - "law.cas.cn"
          - "aemo.com.au"
          - "cer.gov.au"
          - "nrel.gov"
          - "solargis.com"
          - "power.larc.nasa.gov"
        citation_required: true
    market_reference_data:
      enabled: true
      rollout: "solar_financial_model"
      description: "使用 data/market_reference_*.yaml 文件作为区域参考值对比的数据源"
      freshness_check:
        description: "在 confirm_boundary_parameters 步骤中检查数据文件的新鲜度，若超过 90 天未更新则提示用户"
    evaluation_sidecar:
      enabled: false
      rollout: "contract_only"
    auto_update_prompts:
      enabled: false
      rollout: "disabled"
