# =============================================================================
# australia_nem_trajectory.yaml — NEM电力市场发展轨迹约束数据
# =============================================================================
# 用途：作为外部约束引擎的数据源，基于官方规划数据提供NEM市场发展轨迹。
#       约束引擎根据评估年份自动插值推演电价、CAPEX、等效小时数等参数。
#
# 数据来源：
#   - AEMO 2024 Integrated System Plan (ISP), Step Change 情景
#   - AER State of the Energy Market 2025 (2024年实际数据)
#   - AEMO Connections Scorecard Q1 2026
#   - OpenNEM 实时价格数据验证
#
# 更新规则：
#   - ISP 每两年更新一次（下次：2026年中）
#   - AER 年度报告每年更新（下次：2026年Q2）
#   - 数据有效期至 2026-08-13
# =============================================================================

metadata:
  title: "NEM电力市场发展轨迹约束数据"
  version: "1.0.0"
  last_updated: "2026-05-13"
  next_scheduled_update: "2026-08-13"
  data_sources:
    - name: "AEMO 2024 Integrated System Plan (ISP)"
      scenario: "Step Change"
      url: "https://aemo.com.au/energy-systems/major-publications/integrated-system-plan-isp"
      access_date: "2026-05-06"
      authority_level: "high"
    - name: "AER State of the Energy Market 2025"
      url: "https://www.aer.gov.au/publications/state-energy-market"
      access_date: "2026-05-06"
      authority_level: "high"
    - name: "AEMO Connections Scorecard Q1 2026"
      url: "https://www.aemo.com.au/-/media/files/electricity/nem/network_connections/connections-scorecard/"
      access_date: "2026-05-06"
      authority_level: "high"
  freshness_threshold_days: 90
  disclaimer: >
    本文件数据基于AEMO ISP 2024和AER 2025官方报告提取。
    插值和外推值标注为"interpolated"或"extrapolated"。
    正式投资决策应引用最新官方报告原文。

