# =============================================================================
# 2. BESS套利价差压缩模型
# =============================================================================
spread_compression_model:
  description: >
    BESS套利价差随BESS渗透率增加的压缩模型。
    核心逻辑：BESS越多→低电价时充电需求增加（抬高底部）+
    高电价时放电供给增加（压低峰值）→价差收窄。
    对冲因素：煤电退役（减少基荷供给）+ AI需求增长（增加负荷）。
  source: "基于AEMO ISP 2024 + AER 2025 + 行业经验建模"
  # 基准价差（2025年NSW）
  base_spread:
    year: 2025
    charge_price_aud_mwh: 25
    discharge_price_aud_mwh: 170
    fcas_aud_kw_year: 35
    gross_spread_aud_mwh: 195 # 170 - 25 + FCAS折算
    weighted_avg_price_aud_kwh: 0.219 # 等效加权电价（含FCAS）
    effective_hours: 1028 # 等效年利用小时数

  # 压缩系数
  compression_factors:
    # 每新增1GW BESS对价差的压缩（$/MWh）
    compression_per_gw_bess: 8.0
    # 每退役1GW煤电对价差的支撑（$/MWh）
    coal_retirement_support_per_gw: 5.0
    # 每GW AI新增需求对价差的支撑（$/MWh）
    ai_demand_support_per_gw: 3.0
    # 最大压缩比例（不会无限压缩）
    saturation_cap_pct: 0.55
    # 每新增1GW BESS对等效小时数的压缩（h）
    hours_compression_per_gw_bess: 10.0
    # 每新增1GW BESS对FCAS收益的压缩（$/kW/年）
    fcas_decay_per_gw_bess: 1.5
    # FCAS收益下限
    fcas_floor_aud_kw_year: 15.0

# =============================================================================
# 3. BESS CAPEX学习曲线
# =============================================================================
capex_learning_curve:
  description: >
    LFP电池系统CAPEX随累计装机翻倍的学习曲线。
    基准：2025年NSW 4hr BESS全包CAPEX $1,183/kW（$355M/300MW）。
    学习率：累计装机每翻倍，成本下降12%。
  source: "基于行业学习曲线经验 + market_reference_au.yaml V0.4"
  # 基准CAPEX（2025年）
  base_capex:
    year: 2025
    capex_aud_kw: 1183
    capex_total_aud: 355000000
    capacity_mw: 300
    technology: "bess_4hr_lfp"
    region: "NSW"

  # 学习曲线参数
  learning_params:
    learning_rate: 0.12 # 累计装机翻倍，成本下降12%
    progress_ratio: 0.88 # 1 - learning_rate
    base_cumulative_gw: 3.5 # 2025年累计BESS装机（GW）

  # 年新增BESS装机（用于计算累计翻倍次数）
  annual_installations_gw:
    2025: 2.0
    2026: 3.5
    2027: 5.0
    2028: 5.5
    2029: 6.0
    2030: 6.5
    2031: 7.0
    2032: 7.0
    2033: 7.0
    2034: 7.0
    2035: 7.0

  # CAPEX分项占比（用于分项推演）
  cost_breakdown_pct:
    cell_pack_bms: 29.6 # 电芯+PACK+BMS
    pcs_transformer: 10.1 # PCS+变压器+集装箱
    installation: 11.0 # 安装施工+并网调试
    epc_management: 4.2 # EPC管理+利润
    grid_connection: 16.9 # 接入费用
    development: 2.8 # 开发费
    other: 25.4 # 其他（含融资成本、不可预见费等）

# =============================================================================
# 4. 接入成本趋势
# =============================================================================
grid_connection_trend:
  description: >
    NEM并网接入成本趋势。
    受AI数据中心需求激增、劳动力短缺、设备价格上涨影响。
  source: "Intium Grid Connection Survey Nov 2025 + AEMO Connections Scorecard Q1 2026"
  # 基准接入成本（2025年NSW 300MW级）
  base_connection_cost_aud: 60000000

  # 年度涨幅
  annual_escalation_pct: 5.0 # 年化涨幅（劳动力+设备+竞争）
  ai_demand_premium_pct: 10.0 # AI数据中心需求导致的额外溢价

  # 接入延迟风险
  delay_risk:
    pct_developers_experiencing_delays: 78
    avg_delay_years: 1.5
    cost_overrun_pct: 20

# =============================================================================
# 5. 融资环境趋势
# =============================================================================
financing_trend:
  description: "融资成本随宏观环境和项目风险的变化趋势"
  source: "RBA利率路径 + 行业经验"

  # 基准融资条件（2025年）
  base_interest_rate: 0.06
  base_loan_tenor_years: 15
  base_discount_rate: 0.09

  # 利率调整
  interest_rate_adjustment:
    # 每新增10GW BESS，项目风险溢价+0.5%（竞争加剧→银行要求更高回报）
    risk_premium_per_10gw_bess: 0.005
    # 2030年前利率下行预期（RBA降息周期）
    macro_rate_reduction_by_2030: -0.01

