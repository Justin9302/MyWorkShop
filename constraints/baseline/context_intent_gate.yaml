#=============================================================================
# context_intent_gate.yaml — 强制前置门禁规则
#
# 功能：在每次任务启动时，必须先完成上下文读取与意图确认，才能继续执行。
#       这是所有约束中最先被检查的规则。定义了7条门禁规则：
#       1. mandatory_startup_read — 强制读取关键配置文件
#       2. intent_confirmation_required — 意图确认字段检查
#       3. high_risk_pause — 高风险任务暂停确认
#       4. file_truncation_protection — 文件截断防护
#       5. load_only_relevant_context — 仅加载相关上下文
#       6. record_gate_in_snapshot — 门禁结果记录
#       7. git_commit_required — 文件修改后强制Git提交
#
# 关联：
#   - config/workspace_usage_guide.md（Cline 行为标准第一步）
#   - config/context-loading.yaml（上下文加载策略）
#   - config/active-release.yaml（当前版本引用）
#   - docs/INDEX.md（文档索引）
#   - scripts/task_init_check.py（启动检查脚本）
#=============================================================================

constraint_pack:
  id: "baseline_context_intent_gate"
  version: "0.1.0"
  status: "draft"
description: "强制前置门禁：任何工作流在接收用户输入后，必须先完成上下文读取与意图确认，不得直接生成最终答案或执行工具调用。"
applies_to:
  - "all_workflows"
gate_rules:
  - id: "mandatory_startup_read"
    severity: "critical"
    rule: "Before any workflow execution, read the mandatory startup sequence in order: docs/model_context.md → config/active-release.yaml → README.md → docs/current_workspace_creation_plan.md → constraints/baseline/context_intent_gate.yaml → config/workspace_usage_guide.md. This sequence aligns with config/context-loading.yaml required_startup_sequence."
    on_failure: "block_and_report"
  - id: "intent_confirmation_required"
    severity: "critical"
    rule: "Workflow must identify user goal, industry, jurisdiction, risk level, target output, active release version, required assets, missing information, and approval needs before proceeding."
    required_fields:
      - "user_goal"
      - "industry"
      - "risk_level"
      - "target_output"
      - "active_release"
    on_failure: "pause_and_request_input"
  - id: "high_risk_pause"
    severity: "high"
    rule: "If task is high risk, under-specified, permission-sensitive, or changes platform behavior, pause and ask user to confirm before proceeding."
    on_failure: "pause_and_request_approval"
  - id: "file_truncation_protection"
    severity: "critical"
    rule: "Before modifying any existing file, evaluate file size with `wc -l` and confirm read_file returned complete content. If file is truncated (returned content shorter than actual line count), follow the file truncation protection decision tree in config/workspace_usage_guide.md. Never use write_to_file to overwrite an existing file without confirming content completeness."
    on_failure: "block_and_report"
  - id: "load_only_relevant_context"
    severity: "high"
    rule: "Load only workflow, constraint, prompt, schema, and tool permissions relevant to the confirmed intent. Do not load unrelated industry or jurisdiction packages."
    on_failure: "warn_and_record"
  - id: "record_gate_in_snapshot"
    severity: "high"
    rule: "Context intent gate results (passed/blocked/paused), intent summary, and loaded assets must be recorded in run_snapshot.context_intent_gate."
    on_failure: "record_omission_reason"
  - id: "git_commit_required"
    severity: "high"
    rule: "After completing any file modification operation (fix, update, create, delete), the workflow must execute a Git commit to record the change locally before proceeding to the next task or concluding. Commit rules differ by file category: system layer changes require strict conventional commit format and immediate submission; work content changes allow flexible format and batch submission at task end. See 'Git提交规则分类' in config/workspace_usage_guide.md for the full category definitions and rules."
    on_failure: "block_and_report"
audit:
  record_gate_status: true
  record_intent_summary: true
  record_loaded_assets: true
  record_blocked_assets: true
  target_schema: "schemas/run_snapshot.schema.json"
