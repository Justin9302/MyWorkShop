constraint_pack:
  id: "baseline_human_review"
  version: "0.2.0"
  status: "active"
  description: "Phase 9: 人审约束包 — 包含中断触发规则和恢复条件"
review_triggers:
  - id: "legal_or_regulatory_advice"
    severity: "critical"
    reviewer_role: "qualified_legal_or_compliance_reviewer"
    interruption_reason: "requires_human_approval"
    resume_condition: "qualified reviewer approves or modifies final position"
    cancel_condition: "reviewer rejects output"
  - id: "investment_or_financial_recommendation"
    severity: "critical"
    reviewer_role: "authorized_finance_reviewer"
    interruption_reason: "requires_human_approval"
    resume_condition: "authorized finance reviewer approves or modifies recommendation"
    cancel_condition: "reviewer rejects recommendation"
  - id: "external_publication"
    severity: "high"
    reviewer_role: "business_owner"
    interruption_reason: "requires_human_approval"
    resume_condition: "business owner approves content for publication"
    cancel_condition: "business owner rejects publication"
  - id: "material_platform_asset_change"
    severity: "high"
    reviewer_role: "platform_owner"
    interruption_reason: "requires_human_approval"
    resume_condition: "platform owner approves or modifies change"
    cancel_condition: "platform owner rejects change"
  - id: "high_risk_business_claim"
    severity: "high"
    reviewer_role: "business_owner_or_strategy_reviewer"
    interruption_reason: "requires_human_approval"
    resume_condition: "business owner or strategy reviewer approves claim"
    cancel_condition: "reviewer rejects claim"
  - id: "tool_permission_escalation"
    severity: "high"
    reviewer_role: "platform_owner_or_security_reviewer"
    interruption_reason: "tool_permission_required"
    resume_condition: "user authorizes or denies tool permission"
    cancel_condition: "user denies permission"
  - id: "high_risk_output_validation"
    severity: "critical"
    reviewer_role: "qualified_reviewer"
    interruption_reason: "high_risk_output"
    resume_condition: "qualified reviewer approves or modifies final output"
    cancel_condition: "reviewer rejects output"
rules:
  - id: "pause_before_high_risk_final"
    rule: "High or critical risk outputs must pause before final use until the required reviewer approves, modifies, or rejects them."
    interruption_trigger: true
    interruption_reason: "high_risk_output"
  - id: "record_review_status"
    rule: "Review requirement, reviewer role, status, and notes summary must be recorded in run_snapshot.human_review."
    interruption_trigger: false
  - id: "interruption_on_missing_input"
    rule: "If required input is missing, the workflow must pause and create an interruption event with pending questions."
    interruption_trigger: true
    interruption_reason: "missing_required_input"
  - id: "interruption_on_tool_permission"
    rule: "If a step requires a tool with external_network or write permission, the workflow must pause for user authorization."
    interruption_trigger: true
    interruption_reason: "tool_permission_required"
  - id: "interruption_on_evidence_gap"
    rule: "If citation evidence is insufficient for a high-risk claim, the workflow must pause and request additional sources."
    interruption_trigger: true
    interruption_reason: "evidence_gap"
