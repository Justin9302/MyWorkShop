constraint_pack:
  id: "baseline_tool_permissions"
  version: "0.1.0"
  status: "draft"
rules:
  - id: "registered_tools_only"
    severity: "high"
    rule: "Workflows may only call tools registered in config/mcp-tools.yaml."
  - id: "write_requires_confirmation"
    severity: "high"
    rule: "Any tool call that writes files, modifies platform assets, or sends data externally requires confirmation or human approval."
  - id: "summarize_tool_results"
    severity: "medium"
    rule: "Tool outputs must be recorded as summaries in run snapshots; sensitive raw outputs must not be written into Git."
  - id: "git_commit_after_fix"
    severity: "high"
    rule: 'After completing any file modification (fix, update, create, delete), immediately commit changes to local Git repository with a descriptive message. The commit message format and submission frequency depend on the file category (system layer vs work content). See the "Git提交规则分类" section in config/workspace_usage_guide.md for detailed rules. Run ''git add . && git commit -m "<message>"'' after each file fix session before concluding the task or moving to the next step.'
