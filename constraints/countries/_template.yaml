# =============================================================================
# _template.yaml — 国家约束模板
#
# 用途：定义特定国家的能源行业约束、政策法规和市场规则。
#       当用户首次使用新国家时，根据此模板创建对应国家的约束文件。
#
# 创建规则：
#   1. 使用 fetch 工具获取该国最新能源政策、电价、补贴信息
#   2. 所有数据标注来源和获取日期
#   3. 有效期不超过 90 天
#   4. 文件名为 <country_code>.yaml（如 au.yaml, cn.yaml, us.yaml）
# =============================================================================

constraint_pack:
  id: "country_<country_code>"
  version: "0.1.0"
  status: "draft"
metadata:
  country: "<country_name>"
  country_code: "<country_code>"
  currency: "<currency_code>"
  description: "<国家名称>能源行业约束与市场规则"
  effective_date: "<YYYY-MM-DD>"
  last_updated: "<YYYY-MM-DD>"
  data_source: "<数据来源描述>"
  data_freshness_days: 0
  authority_level: "reference"
  policy_references:
    # ── 国家层面能源政策 ──
    - id: "<policy_id_1>"
      title: "<政策文件标题>"
      document_number: "<文号>"
      issuer: "<发布机构>"
      date: "<YYYY-MM-DD>"
      url: "<政策文件链接>"
      summary: "<政策要点摘要>"

    # ── 电力市场规则 ──
    - id: "<market_rule_id_1>"
      title: "<市场规则标题>"
      issuer: "<发布机构>"
      date: "<YYYY-MM-DD>"
      url: "<规则文件链接>"
      summary: "<规则要点摘要>"

    # ── 补贴政策 ──
    - id: "<subsidy_id_1>"
      title: "<补贴政策标题>"
      issuer: "<发布机构>"
      date: "<YYYY-MM-DD>"
      url: "<政策文件链接>"
      summary: "<补贴政策要点摘要>"

rules:
  # ── 通用规则 ──
  - id: "country_data_freshness"
    severity: "high"
    rule: "本文件数据自 last_updated 起有效期 90 天。超过 90 天必须重新获取最新数据或标注过期风险。"

  - id: "separate_fact_assumption"
    severity: "high"
    rule: "必须明确区分政策事实（已发布文件）、假设（待验证的判断）、推算（基于模型的计算）和待验证事项。"

  # ── 电力市场规则 ──
  - id: "market_structure"
    severity: "high"
    rule: "<国家名称>电力市场结构描述：市场化程度、交易品种、价格机制等。"

  - id: "grid_characteristics"
    severity: "medium"
    rule: "<国家名称>电网特点描述：电源结构、季节性特征、区域差异等。"

  # ── 项目开发规则 ──
  - id: "development_permit_requirements"
    severity: "high"
    rule: "<国家名称>新能源项目开发所需的许可和审批清单。"

  - id: "land_ownership_rules"
    severity: "medium"
    rule: "<国家名称>土地所有权和使用权规则，对新能源项目的影响。"

  # ── 财务与税务规则 ──
  - id: "tax_regulations"
    severity: "medium"
    rule: "<国家名称>与新能源项目相关的税收政策（公司税率、折旧规则、税收优惠等）。"

  - id: "depreciation_standards"
    severity: "medium"
    rule: "<国家名称>固定资产折旧标准，特别是新能源设备的折旧年限和方法。"

  # ── 环境与社会规则 ──
  - id: "environmental_requirements"
    severity: "high"
    rule: "<国家名称>新能源项目的环境评估要求和环保标准。"

  - id: "community_engagement"
    severity: "medium"
    rule: "<国家名称>新能源项目的社区参与和利益相关方沟通要求。"

  # ── 市场参考数据 ──
  - id: "reference_capex_range"
    severity: "reference"
    rule: "<国家名称>各类新能源技术的 CAPEX 参考范围（AUD/kW 或当地货币/kW）。"

  - id: "reference_ppa_price"
    severity: "reference"
    rule: "<国家名称>PPA 电价参考范围（AUD/MWh 或当地货币/MWh）。"

  - id: "reference_wholesale_price"
    severity: "reference"
    rule: "<国家名称>电力批发市场价格参考范围。"

  - id: "reference_lcoe"
    severity: "reference"
    rule: "<国家名称>各类新能源技术的 LCOE 参考范围。"

  - id: "reference_discount_rate"
    severity: "reference"
    rule: "<国家名称>新能源项目折现率参考范围。"

  - id: "reference_capacity_factor"
    severity: "reference"
    rule: "<国家名称>各类新能源技术的容量因子参考范围。"
