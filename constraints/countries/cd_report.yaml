rules:
  - id: "country_data_freshness"
    severity: "high"
    rule: "本文件数据自 last_updated 起有效期 90 天。超过 90 天必须重新获取最新数据或标注过期风险。"

  - id: "separate_fact_assumption"
    severity: "high"
    rule: "必须明确区分政治/经济事实（已发布数据）、推断（基于数据的推测）、假设（待验证的判断）和待验证事项。"

  - id: "source_attribution"
    severity: "high"
    rule: "所有数据必须标注来源 ID（引用 data_sources 列表中的来源）和获取日期。"

  - id: "cd_ppa_currency"
    severity: "high"
    rule: "刚果(金)PPA必须以美元计价，CDF汇率波动大（年均贬值10-15%），不接受CDF计价PPA。"

  - id: "cd_offtaker_assessment"
    severity: "high"
    rule: "矿业企业PPA必须进行购电方营运风险评估，包括矿山寿命匹配度、财务实力、大宗商品周期抗风险能力、东道国政策稳定性、信用增强措施五个维度。"

