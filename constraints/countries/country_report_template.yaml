# =============================================================================
# country_report_template.yaml — 国别报告约束模板
#
# 用途：定义特定国家的政治、经济、安全、行业政策、税收与法律等
#       全方位约束条件。用于国别报告工作流（country_report）的
#       数据收集和约束加载阶段。
#
# 与 constraints/countries/_template.yaml 的区别：
#   - _template.yaml 侧重能源行业约束（电价、补贴、CAPEX等）
#   - 本模板侧重国别风险评估（政治、经济、安全、政策、税收等）
#
# 创建规则：
#   1. 使用 fetch 工具获取该国最新政治、经济、安全、政策信息
#   2. 所有数据标注来源和获取日期
#   3. 有效期不超过 90 天
#   4. 文件名为 <country_code>_report.yaml（如 au_report.yaml, cn_report.yaml）
# =============================================================================

constraint_pack:
  id: "country_report_<country_code>"
  version: "0.1.0"
  status: "draft"

metadata:
  country: "<country_name>"
  country_code: "<country_code>"
  region: "<region>"
  capital: "<capital_city>"
  population: "<population>"
  official_language: "<language>"
  currency: "<currency_code>"
  timezone: "<timezone>"
  description: "<国家名称>国别风险评估约束与数据"
  effective_date: "<YYYY-MM-DD>"
  last_updated: "<YYYY-MM-DD>"
  data_freshness_days: 0
  authority_level: "reference"

  # ── 数据来源索引 ──
  data_sources:
    - id: "source_1"
      name: "<来源名称>"
      type: "international_organization / government / industry / media"
      url: "<来源URL>"
      access_date: "<YYYY-MM-DD>"
      data_type: "political / economic / security / policy / tax / business"

    - id: "source_2"
      name: "<来源名称>"
      type: "international_organization / government / industry / media"
      url: "<来源URL>"
      access_date: "<YYYY-MM-DD>"
      data_type: "political / economic / security / policy / tax / business"

# ── 通用规则 ──
rules:
  - id: "country_data_freshness"
    severity: "high"
    rule: "本文件数据自 last_updated 起有效期 90 天。超过 90 天必须重新获取最新数据或标注过期风险。"

  - id: "separate_fact_assumption"
    severity: "high"
    rule: "必须明确区分政治/经济事实（已发布数据）、推断（基于数据的推测）、假设（待验证的判断）和待验证事项。"

  - id: "source_attribution"
    severity: "high"
    rule: "所有数据必须标注来源 ID（引用 data_sources 列表中的来源）和获取日期。"

# ── 政治环境约束 ──
political:
  government_type: "<政府类型：总统制/议会制/君主制/一党制等>"
  head_of_state: "<国家元首姓名及任期>"
  head_of_government: "<政府首脑姓名及任期>"
  next_election_date: "<下次大选/选举日期>"
  election_cycle_years: <选举周期年数>

  # ── 治理指标 ──
  governance_indicators:
    wgi_voice_accountability:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

    wgi_political_stability:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

    wgi_government_effectiveness:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

    wgi_regulatory_quality:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

    wgi_rule_of_law:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

    wgi_control_of_corruption:
      score: "<分数>"
      percentile: "<百分位排名>"
      year: "<数据年份>"
      source_id: "source_1"

  corruption_perceptions_index:
    score: "<CPI分数，0-100>"
    rank: "<全球排名>"
    year: "<数据年份>"
    source_id: "source_1"

  # ── 地缘政治风险 ──
  geopolitical_risks:
    - risk: "<地缘政治风险描述>"
      level: "low / medium / high"
      impact: "<潜在影响>"
      source_id: "source_1"

  # ── 国际协定 ──
  international_agreements:
    bilateral_investment_treaties:
      with_china: true/false
      total_count: <总数>
      source_id: "source_1"

    double_taxation_treaties:
      with_china: true/false
      total_count: <总数>
      source_id: "source_1"

    wto_member: true/false
    icsid_member: true/false
    miga_member: true/false

# ── 汇兑自由度约束 ──
exchange_freedom:
  # ── 外汇管制制度 ──
  exchange_control_regime:
    regime_type: "free / managed / controlled / closed"
    local_currency_convertibility: "fully_convertible / partially_convertible / non_convertible"
    exchange_rate_system: "free_float / managed_float / crawling_peg / fixed / dual / multiple"
    official_rate_usd: <官方汇率>
    parallel_market_rate_usd: <平行市场汇率>
    parallel_market_premium: "<平行市场溢价百分比>"
    source_id: "source_1"

  # ── 利润汇回限制 ──
  profit_repatriation:
    dividend_repatriation:
      allowed: true/false
      approval_required: true/false
      approval_authority: "<审批机构>"
      typical_processing_time_days: <处理天数>
      annual_limit_usd: "<年度上限金额>"
      additional_tax_withholding: "<额外预提税率>"
      source_id: "source_1"

    interest_repatriation:
      allowed: true/false
      approval_required: true/false
      approval_authority: "<审批机构>"
      typical_processing_time_days: <处理天数>
      source_id: "source_1"

    royalty_repatriation:
      allowed: true/false
      approval_required: true/false
      approval_authority: "<审批机构>"
      typical_processing_time_days: <处理天数>
      source_id: "source_1"

    capital_repatriation:
      allowed: true/false
      lock_in_period_years: <锁定期年限>
      approval_required: true/false
      approval_authority: "<审批机构>"
      source_id: "source_1"

  # ── 强制结汇要求 ──
  mandatory_surrender:
    exists: true/false
    surrender_percentage: "<强制结汇比例>"
    applicable_to: "all_exports / specific_sectors / none"
    source_id: "source_1"

  # ── 离岸账户与NDF ──
  offshore_arrangements:
    offshore_account_allowed: true/false
    ndf_market_available: true/false
    ndf_tenors_available: "<可用期限>"
    source_id: "source_1"

  # ── 历史违约记录 ──
  historical_defaults:
    sovereign_default_history:
      exists: true/false
      last_event_year: "<最近违约年份>"
      details: "<违约详情>"
      source_id: "source_1"

    capital_control_tightening:
      exists: true/false
      last_event_year: "<最近收紧年份>"
      details: "<收紧详情>"
      source_id: "source_1"

    forex_account_freeze:
      exists: true/false
      last_event_year: "<最近冻结年份>"
      details: "<冻结详情>"
      source_id: "source_1"

  # ── 汇兑自由度评分参考 ──
  scoring_reference:
    imf_areaer_restriction_index: "<IMF限制指数>"
    overall_freedom_score: "<综合评分，1-5>"
    assessment_summary: "<评估摘要>"
    source_id: "source_1"

