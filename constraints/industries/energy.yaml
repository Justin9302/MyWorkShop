      issuer: "四川省发展和改革委员会、四川省能源局"
      date: "2025"
      summary: "需求响应补偿标准：日前响应0-3元/kWh，月度备用容量0-5元/kW·月，应急响应为日前出清价的10%。是四川VPP和需求响应收益测算的核心依据。"
    - id: "sc_toU_2025_185"
      title: "关于进一步调整我省分时电价机制的通知"
      document_number: "川发改价格〔2025〕185号"
      issuer: "四川省发展和改革委员会"
      date: "2025"
      summary: "四川省分时电价机制：夏季（7-9月）高峰约0.857元/度，平段约0.546元/度，低谷约0.236元/度。丰水期低谷电价最低可至0.175元/度。峰谷价差显著，为储能套利提供空间。"
    - id: "sc_price_2025_299"
      title: "关于主动错避峰响应补偿标准的函"
      document_number: "川发改价格函〔2025〕299号"
      issuer: "四川省发展和改革委员会"
      date: "2025"
      summary: "主动错避峰响应补偿标准为0.3元/kWh，是需求响应中补偿率较低但执行难度较低的品种。"

    # ── 四川省储能补贴政策 ──
    - id: "sc_storage_subsidy"
      title: "四川省关于推动新型储能示范项目建设的实施意见"
      issuer: "四川省发展和改革委员会、四川省能源局"
      date: "2025"
      summary: "新型储能示范项目可获总投资15%的补贴，单项最高2000万元。是四川储能项目经济性分析的重要政策依据。"

    # ── 成都市地方补贴政策 ──
    - id: "cd_v2g_2025_6"
      title: "成都市电动汽车充放电（V2G）试点建设补贴实施细则"
      document_number: "成经信规〔2025〕6号"
      issuer: "成都市经济和信息化局"
      date: "2025"
      summary: "成都V2G放电补贴：常规5元/kWh，参与省级响应2元/kWh。鼓励电动汽车参与电网互动。"
    - id: "cd_charging_subsidy"
      title: "成都市充电设施建设补贴标准"
      issuer: "成都市经济和信息化局"
      date: "2025"
      summary: "充电桩建设补贴（按星级分级）：三星100元/kW（单场站最高20万元），二星70元/kW，一星40元/kW，一星以下10元/kW。"

    # ── 补贴政策参考 ──
    - id: "subsidy_policy_freshness"
      severity: "high"
      rule: "涉及四川省电力补贴/补偿的收益测算，必须引用最新的省级政策文件（2025-2026年），标注引用日期。不得使用已过期或废止的政策标准。四川补贴政策包括：需求响应补偿（川发改能源〔2025〕255号）、分时电价（川发改价格〔2025〕185号）、储能补贴（新型储能示范项目15%投资补贴、单项最高2000万元）、辅助服务补偿（2026年5月1日起执行的新细则）、充电桩建设补贴（成都市星级分级标准）等。"
    - id: "subsidy_scenario_analysis"
      severity: "medium"
      rule: "补贴/补偿收益测算应采用多场景分析：保守场景（仅确定性补贴，如容量备用）、基准场景（含预期调用次数和出清价）、乐观场景（含峰值补偿和额外调用）。需求响应日前响应补偿范围0-3元/kWh，应急响应为日前出清价的10%，应区分不同响应类型的收益确定性。"
    - id: "subsidy_geographic_differentiation"
      severity: "medium"
      rule: "四川省内各地市（成都、绵阳、宜宾等）的补贴标准和执行细则可能存在差异。成都市有独立的V2G补贴（5元/kWh）和充电设施星级补贴，省级储能补贴针对示范项目。分析应明确适用于哪个地市，不得将成都市政策自动推广至全省。"
    - id: "subsidy_expiration_tracking"
      severity: "medium"
      rule: "补贴政策通常有有效期或年度调整机制。四川需求侧响应补偿标准按年度实施方案执行，辅助服务细则自2026年5月1日起执行。分析中应标注补贴政策的有效期，并对补贴到期或退坡后的收益进行敏感性分析。"
rules:
  # ── NEM BESS 市场均衡 ──
  - id: "nem_bess_market_equilibrium"
    severity: "high"
    rule: "澳洲NEM纯储能/光储混合项目财务测算必须应用 bess_market_equilibrium 模块，根据项目COD年份（建设期+投产时间）自动调整收入参数。基于AEMO ISP 2024 Step Change 煤电退役路径和政策钟摆模型。禁止假设当前价差2026年不变地适用于远期项目。政策底线IRR 8%（政府保障最低回报），高IRR项目（>15%）应标注先行者优势并说明随时间衰减预期。"
  - id: "nem_bess_policy_pendulum"
    severity: "medium"
    rule: "澳洲电力市场是政府监管市场，非纯自由市场。BESS回报率在政策区间(8%-18% IRR)内摆动。建模时不可假设价差无限压缩（自由市场出清）或无限扩大（忽略BESS饱和效应）。均衡不是自由市场均衡，而是政策定义的最低可行回报下的市场自校正均衡。"

  # ── 电力零售 ──
  - id: "retail_pricing_regulation"
    severity: "high"
    rule: "售电定价方案必须考虑当地电力市场化改革政策、目录电价调整机制和输配电价政策。不得做出未经监管部门批准的固定电价承诺。"
  - id: "customer_classification"
    severity: "medium"
    rule: "电力零售客户分类（大工业/一般工商业/居民/农业）直接影响输配电价和市场化交易资格，必须正确分类并匹配对应规则。"
  - id: "retail_contract_disclosure"
    severity: "high"
    rule: "售电合同关键条款（套餐价格、偏差考核、违约金、续约条件）应以清晰易懂方式向用户披露，避免误导性表述。"

  # ── 虚拟电厂（VPP）──
  - id: "vpp_resource_type"
    severity: "high"
    rule: "VPP 聚合的资源类型（分布式光伏、储能、充电桩、可调负荷等）直接影响调度权限、补贴政策和市场准入，必须明确标识资源类型和容量。"
  - id: "vpp_market_access"
    severity: "high"
    rule: "VPP 参与电力辅助服务市场（调频/调峰/备用/需求响应）需符合当地调度中心注册要求和性能考核标准。收益预测应区分容量市场和电量市场。"
  - id: "vpp_revenue_model"
    severity: "medium"
    rule: "VPP 收益分析应区分确定性收益（容量补贴）和不确定性收益（现货市场价差、辅助服务出清价），并给出不同场景下的敏感性分析。"
  - id: "vpp_technical_requirements"
    severity: "medium"
    rule: "VPP 聚合商应满足数据采集频率、通信协议（如 IEC 61850）、调度响应时间和气象预测精度等技术和安全要求。"

  # ── 充电桩营运 ──
  - id: "charging_pricing_mechanism"
    severity: "high"
    rule: "充电桩服务费、电费和服务费分账方式应符合当地电价政策和充电设施运营管理规定。不得将未经审批的附加费用计入电费。"
  - id: "charging_utilization_model"
    severity: "medium"
    rule: "充电桩利用率模型应区分时段（峰/平/谷）、季节、车辆类型（私家车/营运车/物流车）和充电策略（慢充/快充/超充），避免单一平均值误导。"
  - id: "charging_station_siting"
    severity: "medium"
    rule: "充电站选址分析应考虑配电网容量、变压器负载率、停车场权属、消防要求和当地建桩补贴政策。台区改造方案应评估对供电可靠性的影响。"

  # ── 合同能源管理（EMC）──
  - id: "emc_contract_structure"
    severity: "high"
    rule: "EMC 合同必须明确节能计量方法（IPMVP 或其他标准）、基准年能耗、节能量计算方式、分成比例和合同期限。节能效果保证条款应定义考核标准和违约处理机制。"
  - id: "emc_financial_modeling"
    severity: "medium"
    rule: "EMC 项目财务分析应区分投资方/用户/设备供应商的收益与风险，综合考虑初始投资、节能收益、运维成本、碳交易收益和政策补贴。"
  - id: "emc_measurement_verification"
    severity: "medium"
    rule: "节能效果测量与验证（M&V）方案应包含边界划定、基线调整方法、不确定度评估和争议解决机制。"

  # ── 台区智能化改造 ──
  - id: "grid_transformation_compliance"
    severity: "high"
    rule: "台区智能化改造方案需符合新型电力系统建设要求，考虑分布式电源接入、配电自动化、用采系统升级和台区储能配置等关键技术路线。"
  - id: "transformation_economics"
    severity: "medium"
    rule: "改造方案的经济性分析应包含投资回收期、全生命周期成本（LCC）、供电可靠性提升带来的减少停电损失、以及可能的政府补贴或电价优惠。"
  - id: "data_security_grid"
    severity: "high"
    rule: "台区智能化系统涉及用户用电数据、电网运行数据，应符合数据安全法和电力行业数据分类分级要求。采集、传输、存储环节应有明确的安全措施。"

  # ── 通用能源 ──
  - id: "carbon_policy_awareness"
    severity: "medium"
    rule: "涉及碳资产（CCER、碳配额、绿色电力证书）的分析应区分强制性碳市场与自愿减排市场，了解最新碳价走势和交易规则。"
  # ── 地区差异 ──
  - id: "regional_grid_diversity"
    severity: "medium"
    rule: "中国各省电力市场结构、电源结构、电价水平和交易规则差异显著。分析应明确对应的省级电网和区域市场（如四川电网以水电为主，枯丰期出力差异大），不得将某一省份的模型或政策直接套用到其他省份。"
  - id: "seasonal_hydro_impact"
    severity: "medium"
    rule: "水电主导型电网（如四川）的电力供需存在强季节性特征：丰水期（6-10月）富余水电多、电价偏低；枯水期（12-4月）水电出力下降、电价上升。VPP 和售电模型必须考虑季节性供需变化对收益的影响。"

  - id: "separate_fact_assumption_energy"
    severity: "high"
    rule: "能源业务分析必须明确区分政策事实（已发布文件）、假设（待验证的判断）、推算（基于模型的计算）和待验证事项。电力市场改革政策处于动态变化中，应标注有效日期。"
