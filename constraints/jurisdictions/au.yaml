constraint_pack:
  id: "jurisdiction_au"
  version: "0.2.0"
  status: "draft"
metadata:
  jurisdiction: "AU"
  description: "Australia regulatory context including privacy, consumer law, financial services regulation, and energy project taxation & depreciation"
  effective_date: "2026-01-01"
  last_updated: "2026-05-05"
  authority_level: "reference"
  tax_year: "2025-2026"
  policy_references:
    - id: "ato_effective_life_solar"
      title: "ATO Effective Life — Solar energy devices"
      reference: "ATO Taxation Ruling TR 2024/1"
      summary: "Solar photovoltaic (PV) panels: effective life 20 years; inverters: 10 years; battery storage systems: 15 years (lithium-ion grid-scale)."
    - id: "ato_company_tax_rate"
      title: "Company tax rate for 2025-2026 income year"
      reference: "ATO — Company tax rates"
      summary: "Base rate entity (aggregated turnover < $50M): 25%; other companies: 30%. Energy projects structured as large proprietary or public companies typically subject to 30%."
    - id: "ato_div40_capital_allowances"
      title: "Division 40 — Capital allowances (prime cost / diminishing value)"
      reference: "ITAA 1997 Div 40"
      summary: "Assets depreciated over ATO-determined effective life. Prime cost (straight-line) and diminishing value methods available. For post-10 May 2006 assets: DV rate = 200% / effective life; PC rate = 100% / effective life."
    - id: "ato_backing_business"
      title: "Backing Business Investment — Accelerated depreciation"
      reference: "Treasury Laws Amendment 2024"
      summary: "Assets < $20,000 instant asset write-off for small business (aggregated turnover < $10M). For large energy assets (>$20k), standard effective life depreciation applies."
    - id: "nre_ret_lgcs"
      title: "Renewable Energy Target — Large-scale Generation Certificates (LGCs)"
      reference: "Clean Energy Regulator"
      summary: "Large-scale solar and wind projects create LGCs per MWh generated. LGC revenue is assessable income. Asset cost reduced by LGC value for certain depreciation calculations."
    - id: "au_stamp_duty_energy"
      title: "Stamp duty on energy project assets (varies by state)"
      reference: "State revenue offices (VIC: SRO, NSW: Revenue NSW)"
      summary: "Victoria: stamp duty on land and certain chattels. Transfer of electricity generation licences may trigger duty. Concessions may apply for renewable energy projects."
    - id: "au_withholding_interest"
      title: "Interest withholding tax on cross-border debt financing"
      reference: "ITAA 1936 — Div 11A"
      summary: "Interest paid to non-resident lenders subject to 10% withholding tax (may be reduced under tax treaty). Relevant for project finance with offshore lenders."
    - id: "au_franking_credits"
      title: "Dividend imputation — franking credits"
      reference: "ITAA 1936 — Div 216, ITAA 1997 — Div 207"
      summary: "Australian corporate tax paid flows through to shareholders as franking credits. Relevant for equity return analysis in project financial models."
    - id: "au_gst_supplies"
      title: "GST on energy project supplies"
      reference: "A New Tax System (Goods and Services Tax) Act 1999"
      summary: "Construction of renewable energy projects: input-taxed vs GST-free supplies. Sale of LGCs is GST-free. Electricity supply is GST taxable (10%)."
rules:
  - id: "au_privacy_act_awareness"
    severity: "high"
    rule: "Consider Australian Privacy Act (including Privacy Amendment Act 2024) and APP framework when processing personal information."
  - id: "au_financial_services"
    severity: "high"
    rule: "Financial product advice, recommendations, or analysis may trigger AFSL (Australian Financial Services License) requirements; disclaim and recommend qualified review."
  - id: "australian_consumer_law"
    severity: "medium"
    rule: "Consider ACL (Australian Consumer Law) guarantees, unfair contract terms, and consumer rights when drafting commercial outputs."
  - id: "indigenous_data_sovereignty"
    severity: "low"
    rule: "Be mindful of Indigenous data sovereignty principles when processing data relating to Aboriginal and Torres Strait Islander peoples."

  # ── 公司所得税 ──
  - id: "au_corporate_tax_rate"
    severity: "high"
    rule: "Project financial models must apply the correct Australian corporate tax rate: 30% for public/large proprietary companies; 25% for base rate entities (aggregated turnover < $50M). Energy projects structured as special purpose vehicles (SPVs) with large-scale assets are typically taxed at 30%. State the assumed rate and rationale in the model assumptions."
  - id: "au_tax_year_alignment"
    severity: "high"
    rule: "Australian income year runs 1 July to 30 June. Financial models must align tax calculation periods with the Australian financial year (FY). Model outputs should clearly show which FY each column represents."
  - id: "au_hybrid_mismatch"
    severity: "medium"
    rule: "Cross-border financing structures involving hybrid instruments or entities may trigger the Hybrid Mismatch Rules (Div 832 ITAA 1997). Relevant for projects with international equity or debt investors."
  - id: "au_tax_loss_transfer"
    severity: "medium"
    rule: "Early-stage project losses may be carried forward (subject to same business test or continuity of ownership test per Div 165/175 ITAA 1997). Models should track cumulated tax losses and their utilisation in profitable years."

  # ── 资产折旧 ──
  - id: "au_depreciation_effective_life_solar"
    severity: "high"
    rule: "Solar PV assets (panels): ATO effective life 20 years. Inverters: 10 years. Use these effective lives as baseline unless the taxpayer has obtained a private binding ruling for a different rate. Prime cost depreciation rate for solar PV: 5.0% p.a. (100%/20yrs). Diminishing value rate: 10.0% p.a. (200%/20yrs)."
  - id: "au_depreciation_effective_life_bess"
    severity: "high"
    rule: "Grid-scale BESS (lithium-ion): ATO effective life 15 years for the battery system. Prime cost rate: 6.67% p.a. Diminishing value rate: 13.33% p.a. An 8-year degradation assumption for cycle life is a technical/economic assumption, distinct from ATO tax effective life. The model must clearly distinguish between tax depreciation (for taxable income calculation) and technical degradation (for throughput/performance modelling)."
  - id: "au_depreciation_method"
    severity: "medium"
    rule: "Both prime cost (straight-line) and diminishing value methods are available under Div 40 ITAA 1997. DV method front-loads deductions and may be preferable for project IRR. The model should indicate which method is assumed and why. Most project finance models use straight-line for simplicity and lender conservatism."
  - id: "au_depreciation_capital_works"
    severity: "medium"
    rule: "Civil works, site preparation, fencing, and access roads associated with the energy project constitute capital works (Div 43) rather than plant (Div 40). Capital works deduction rate: 2.5% p.a. (40 years). These assets should be separated from plant and equipment in the depreciation schedule."
  - id: "au_depreciation_idc"
    severity: "medium"
    rule: "Interest during construction (IDC) is generally capitalised to the asset cost and depreciated over the asset's effective life. The model should capitalise IDC to the relevant asset category (long-term plant) rather than expensing it."
  - id: "au_depreciation_financing_fees"
    severity: "medium"
    rule: "Financing fees (arrangement fees, legal costs for debt facilities) are generally deductible over the life of the debt facility under Div 40 or s 25-25 ITAA 1997 (5-year straight-line). The model should not treat financing fees as immediately deductible."

  # ── 投资补贴与优惠 ──
  - id: "au_instant_asset_writeoff"
    severity: "medium"
    rule: "Small business entities (aggregated turnover < $10M) may claim instant asset write-off for assets under $20,000 (2025-2026 thresholds). Large-scale energy projects (>$100M capex) are not eligible. Do not apply instant asset write-off assumptions to utility-scale solar/BESS projects."
  - id: "au_lgc_tax_treatment"
    severity: "high"
    rule: "LGC revenue is assessable income under ordinary concepts (s 6-5 ITAA 1997). The cost base of the asset is NOT reduced by LGC value for Div 40 purposes (unlike some other countries' production tax credits). However, LGC creation and sale economics should be separately modelled from tax depreciation."
  - id: "au_capital_gains_future"
    severity: "low"
    rule: "Future sale of the project (share sale vs asset sale) has significantly different tax outcomes. Asset sale triggers Div 40 balancing adjustment (clawback of excess depreciation). Share sale may access CGT discount (50% for individuals, 33.3% for super, 0% for companies). This is beyond the scope of project financial models but should be noted in the assumptions."

  # ── 跨境融资 ──
  - id: "au_withholding_tax_crossborder"
    severity: "medium"
    rule: "Interest paid to non-resident lenders is subject to 10% withholding tax under Div 11A ITAA 1936. Project finance models with offshore debt should include this cost. Tax treaties (e.g., US, UK, Japan) may reduce the rate."
  - id: "au_thin_capitalisation"
    severity: "medium"
    rule: "Australian thin capitalisation rules (Div 820 ITAA 1997) limit debt deductions where debt-to-equity ratio exceeds 1.5:1 (safe harbour) or 60% gearing. The model's current 60% gearing assumption is at the thin cap safe harbour limit and should be disclosed as such."

  # ── 光伏/储能项目寿命与中期大修 ──
  - id: "au_solar_technical_life"
    severity: "medium"
    rule: "Utility-scale solar PV project technical life is standardised at 25 years for financial modelling purposes, although ATO depreciation effective life is 20 years. The 5-year gap between technical life and tax life represents residual value at end of tax depreciation period. Model should clearly state whether the project is modelled to 20 or 25 years and explain the difference."
  - id: "au_bess_technical_life"
    severity: "medium"
    rule: "Grid-scale BESS (lithium-ion) technical life is 15-20 years depending on cycling regime, depth of discharge, and ambient conditions. Financial models should state the assumed cycle life (typically 6,000-10,000 cycles at 80% DoD) and calendar life separately. A 20-year operation period with 1 cycle/day implies ~7,300 cycles, which may exceed battery cycle life — model should address this."
  - id: "au_inverter_replacement"
    severity: "medium"
    rule: "Utility-scale solar PV inverters (central/string) require replacement every 10-15 years. For a 25-year PV project, at least one inverter mid-life replacement should be modelled. Replacement cost is typically 10-15% of initial PV CAPEX. Models that omit inverter replacement understate lifetime OPEX/Maintenance CAPEX."
  - id: "au_battery_replacement"
    severity: "high"
    rule: "BESS battery modules degrade over time and may require replacement or augmentation at mid-life (year 10-12) to maintain rated capacity. Replacement cost is typically 60-70% of initial BESS CAPEX (declining with battery price trends). Financial models for >15-year BESS projects MUST include a mid-life battery replacement or augmentation cost. Models that omit this overstate project IRR and understate LCOS."
  - id: "au_bess_degradation_model"
    severity: "medium"
    rule: "BESS capacity degradation (typically 2-3% p.a. for lithium-ion) must be modelled separately from calendar life. After 10 years, a BESS may retain 70-80% of initial capacity. Models should apply annual degradation to throughput/revenue, not just as a single end-of-life replacement trigger."
  - id: "au_pv_degradation"
    severity: "low"
    rule: "PV module degradation is typically 0.5-0.7% p.a. (linear). After 25 years, modules retain ~80-85% of initial rated capacity. Most models include this in the generation profile. Verify the degradation rate used is consistent with module warranty (typically 80-85% at year 25)."

  # ── 数据时效性与模型年代 ──
  - id: "au_data_freshness_model_vintage"
    severity: "high"
    rule: "Financial models from 2019 or earlier contain cost parameters that are significantly outdated relative to 2025-2026 market conditions. Notable changes include: BESS CAPEX down ~40-50% (from ~$1,000/kW to ~$500-700/kW); PV CAPEX down ~30-40%; BESS duration cost curve shifted (4hr+ becoming standard). When processing a pre-2022 model, flag all cost parameters as potentially outdated and seek current market data from the user."
  - id: "au_data_freshness_user_query"
    severity: "high"
    rule: "When key financial parameters are uncertain, missing, or clearly outdated, the analysis MUST pause and query the user. Parameters that always require user confirmation: (1) PPA price or revenue assumption; (2) CAPEX per kW/MW; (3) OPEX per kW/year; (4) discount rate; (5) debt margin and tenor; (6) mid-life replacement costs. Do not substitute assumed values without explicit user consent."
  - id: "au_market_reference_2025"
    severity: "medium"
    rule: "The following market reference ranges are indicative only (2025-2026, Australian NEM): BESS CAPEX $500-700/kW (2hr), $800-1,100/kW (4hr); Solar PV CAPEX $1,000-1,500/kWp (utility-scale); PPA prices $45-70/MWh (solar), $80-150/MWh (BESS, firming). These are NOT substitutes for project-specific quotes. Always disclaim and recommend verified procurement data."
