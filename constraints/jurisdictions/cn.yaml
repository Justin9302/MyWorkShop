constraint_pack:
  id: "jurisdiction_cn"
  version: "0.2.0"
  status: "draft"
metadata:
  jurisdiction: "CN"
  description: "China (PRC) regulatory context including cybersecurity, data security, cross-border data transfer rules, and energy sector regulations"
  effective_date: "2026-01-01"
  authority_level: "reference"
rules:
  # ── 通用数据与网络安全 ──
  - id: "prc_data_law_awareness"
    severity: "high"
    rule: "Consider PRC Cybersecurity Law, Data Security Law, and Personal Information Protection Law (PIPL) requirements when processing China-related data."
  - id: "cross_border_data_restriction"
    severity: "high"
    rule: "Cross-border transfer of data originating in China may be subject to security assessment, certification, or standard contract requirements."
  - id: "content_regulation"
    severity: "medium"
    rule: "Be aware of China's content regulation framework; flag outputs that may require compliance review."

  # ── 电力市场化改革 ──
  - id: "cn_electricity_market_reform"
    severity: "high"
    rule: "中国电力市场化改革处于持续深化阶段。涉及电力交易、售电侧改革、现货市场、辅助服务市场的分析应参考最新国家发改委、国家能源局政策文件（如《电力体制改革方案》（中发〔2015〕9号）及配套文件、各省电力市场规则）。政策变化频繁，应标注政策引用日期。"
  - id: "cn_capacity_and_spot_market"
    severity: "medium"
    rule: "分析电力市场收益时需区分中长期合同市场、现货市场（日前/实时）、辅助服务市场和容量市场（试点阶段）的不同交易规则和出清机制。各省市场建设进度不同。"
  - id: "cn_retail_electricity_pricing"
    severity: "high"
    rule: "售电价格受政府目录电价（基准价+浮动区间）管控和市场化交易双重影响。分析售电收益时应考虑输配电价、政府性基金及附加、交叉补贴和分时电价（尖峰/峰/平/谷）等复杂因素。"

  # ── 分布式能源与 VPP ──
  - id: "cn_distributed_grid_connection"
    severity: "high"
    rule: "分布式光伏、储能、VPP 并网需符合《分布式电源并网标准》和当地电网公司并网技术要求。余量上网、全额上网和自发自用模式的电价政策各有不同。"
  - id: "cn_demand_response_policy"
    severity: "medium"
    rule: "需求响应和虚拟电厂参与市场需关注国家及省级电力需求侧管理办法、需求响应补贴标准和辅助服务市场注册要求。省级政策差异较大。"
  - id: "cn_sichuan_power_market"
    severity: "medium"
    rule: "四川省电力市场特色：（1）水电装机占比超 80%，丰枯期出力差异可达 3-4 倍，直接影响电力供需平衡和电价走势；（2）四川是首批电力现货市场试点省份之一，现货规则持续迭代，2026年迎峰度夏期间电力现货及辅助服务市场建设是重点任务；（3）丰水期富余水电外送受省间通道容量限制，可能导致省内电价承压；（4）VPP 聚合储能可在枯水期顶峰、丰水期消纳富余水电，收益模式与火电主导省份不同。分析四川项目时应优先参考四川省经济和信息化厅、四川能源监管办（scb.nea.gov.cn）、国网四川电力发布的最新规则。"
  - id: "cn_sichuan_ancillary_service_2026"
    severity: "high"
    rule: "四川能源监管办已于2026年4月发布新版《四川省电力辅助服务管理实施细则》和《四川省电力并网运行管理实施细则》（来源：scb.nea.gov.cn）。VPP、储能、可调负荷参与四川省辅助服务市场的规则以此为准。分析前应获取该细则全文并确认具体条款。"
  - id: "cn_interprovincial_spot_2026"
    severity: "medium"
    rule: "国家发改委/能源局于2026年4月批复同意修订后的《省间电力现货交易规则》（发改办体改〔2026〕275号），完善了跨省跨区电力交易机制。省间现货交易对四川富余水电外送和VPP跨省交易收益有直接影响。"
  - id: "cn_sichuan_charging_2026"
    severity: "medium"
    rule: "四川能源监管办2026年供电监管工作会议明确提出：着力破解充电桩报装堵点难点、推动非电网直供电小区改造接收。这表明四川省充电基础设施建设的政策环境持续向好，但也需关注报装审批环节的实际操作障碍。"
  - id: "cn_power_market_data_2026q1"
    severity: "low"
    rule: "2026年Q1全国电力市场数据参考：交易电量18416亿千瓦时（同比+25.6%），现货交易电量2467亿千瓦时，绿电交易756亿千瓦时（同比+3.1%）。全国充电枪总数2148.1万个（同比+46.9%），公共充电枪486.3万个（同比+28.1%）（来源：国家能源局，2026-04）。这些数据可用于市场基准对标，但需注意省级数据差异。"

  # ── 充电基础设施 ──
  - id: "cn_charging_infrastructure_policy"
    severity: "medium"
    rule: "充电桩建设与运营需符合《电动汽车充电基础设施发展指南》及各省市建桩规划要求。关注充电服务费上限、运营补贴标准、大工业/一般工商业用电电价政策及峰谷时段优化。"
  - id: "cn_charging_safety_standards"
    severity: "high"
    rule: "充电设施需满足国标 GB/T 18487、GB/T 20234、GB/T 27930 等安全与通信协议标准。运营数据采集需符合个人信息保护法要求。"

  # ── 合同能源管理 ──
  - id: "cn_emc_policy"
    severity: "medium"
    rule: "合同能源管理项目可享受节能节水税收优惠政策。涉及财政补贴的应参考国家及地方节能专项资金管理办法。EMC 合同纠纷适用的法律依据为《合同法》及节能服务相关司法解释。"

  # ── 碳市场 ──
  - id: "cn_carbon_market"
    severity: "medium"
    rule: "中国碳排放权交易市场（全国碳市场）已覆盖发电行业并将逐步扩展。涉及碳交易、CCER 的分析应考虑最新《碳排放权交易管理办法（试行）》及交易规则。碳价受配额分配方案和市场供需影响波动较大。"
  - id: "cn_green_certificate"
    severity: "medium"
    rule: "绿色电力证书（GEC）交易与可再生能源电力消纳保障机制挂钩。涉及绿证的分析需区分补贴绿证和平价绿证，了解最新绿证交易政策和消纳责任权重要求。"

  # ── 四川省补贴政策 ──
  - id: "cn_sichuan_subsidy_policy_2025_2026"
    severity: "high"
    rule: "四川省电力相关补贴政策（2025-2026年）包括：（1）需求响应补偿：日前响应0-3元/kWh，月度备用容量0-5元/kW·月，主动错避峰0.3元/kWh（川发改能源〔2025〕255号、川发改价格函〔2025〕299号）；（2）调峰补偿：独立储能充电350元/MWh（2026年5月1日起，源自四川省电力辅助服务管理实施细则）；（3）调频补偿：小扰动200元/MWh、大扰动1000元/MWh、模拟扰动450元/MWh；（4）储能建设补贴：新型储能示范项目总投资15%、单项最高2000万元；（5）充电桩建设补贴（成都）：三星100元/kW、单场站最高20万元；（6）成都V2G放电补贴：常规5元/kWh、参与省级响应2元/kWh（成经信规〔2025〕6号）。分析四川项目收益时，应优先使用上述标准，并注意政策逐年的调整可能。"
  - id: "cn_sichuan_toU_and_spot"
    severity: "medium"
    rule: "四川省分时电价（川发改价格〔2025〕185号）和现货市场出清价（上限800元/MWh、下限-50元/MWh）共同决定储能/VPP套利空间。分时电价峰谷价差约0.62元/kWh（高峰0.857元/度 vs 低谷0.236元/度），丰水期低谷电价最低0.175元/度。现货市场可能出现负电价，对VPP充放电策略和风险控制提出更高要求。"
