#=============================================================================
# sync-manifest.yaml — 文档同步依赖清单
#
# 功能：声明所有文件之间的依赖关系。每次修改一个文件后，
#       必须根据此清单检查关联文件是否需要同步更新。
#
# 用法：
#   scripts/sync_checker.py --check-source <修改的文件>
#
# check_kind 类型说明：
#   - version_alignment:        版本号必须一致
#   - component_list_presence:  组件列表必须包含新增项
#   - exact_list_match:         列表必须完全一致
#   - list_superset_check:      目标列表必须是源列表的超集
#   - startup_sequence_alignment: 启动序列必须一致
#   - process_step_alignment:   流程步骤必须一致
#   - file_list_presence:       文件列表必须包含新增项
#   - directory_structure_sync: 目录结构描述必须同步
#   - session_reference_sync:   会话引用必须指向最新
#   - changelog_entry_exists:   CHANGELOG 条目必须存在
#   - mcp_tool_list_sync:       MCP 工具列表必须同步
#   - feature_flag_sync:        功能开关状态必须同步
#   - prompt_manifest_sync:     Prompt 清单必须同步
#   - git_boundary_sync:        Git 边界规则必须同步
#   - available_asset_root_sync: 可用资产根目录必须同步
#   - country_constraint_sync:  国家约束引用必须同步
#   - market_reference_sync:    市场数据引用必须同步
#   - knowledge_base_sync:      知识库引用必须同步
#   - schema_list_sync:         Schema 列表必须同步
#   - judge_config_sync:        Judge 配置必须同步
#   - judge_model_sync:         Judge 模型列表必须同步
#   - eval_set_directory_sync:  评估集目录必须同步
#   - regression_test_sync:     回归测试配置必须同步
#   - dashboard_test_sync:      仪表盘测试配置必须同步
#   - rollout_test_sync:        灰度发布测试配置必须同步
#   - workflow_runner_sync:     工作流运行器配置必须同步
#   - interruption_handler_sync: 中断处理器配置必须同步
#   - lattice_schema_sync:      Lattice Schema 列表必须同步
#   - lattice_script_sync:      Lattice 脚本列表必须同步
#   - lattice_workflow_sync:    Lattice 工作流列表必须同步
#   - lattice_template_sync:    Lattice 模板列表必须同步
#   - lattice_example_sync:     Lattice 示例列表必须同步
#   - rubric_reference_sync:    评分标准引用必须同步
