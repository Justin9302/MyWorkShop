#=============================================================================
# 同步依赖声明
# 每次修改 source 文件后，必须检查所有 target 文件是否需要同步更新
#=============================================================================

sync_dependencies:
  # ── active-release.yaml ──
  - source: "config/active-release.yaml"
    modify_triggers:
      - target: "docs/model_context.md"
        reason: "组件版本号变更"
        check_kind: "version_alignment"
      - target: "docs/INDEX.md"
        reason: "组件注册变更（增/删 workflow/constraint/prompt）"
        check_kind: "component_list_presence"
      - target: "CHANGELOG.md"
        reason: "版本更新日志"
        check_kind: "changelog_entry_exists"
      - target: "config/releases/"
        reason: "发布状态变更需同步 manifest"
        check_kind: "release_manifest_sync"

  # ── mcp-tools.yaml ──
  - source: "config/mcp-tools.yaml"
    modify_triggers:
      - target: ".vscode/mcp.json"
        reason: "MCP 工具列表必须与实际配置一致"
        check_kind: "exact_list_match"
      - target: "config/active-release.yaml"
        reason: "active MCP 工具列表变更"
        check_kind: "list_superset_check"

  # ── context_intent_gate.yaml ──
  - source: "constraints/baseline/context_intent_gate.yaml"
    modify_triggers:
      - target: "config/context-loading.yaml"
        reason: "启动序列规则变更"
        check_kind: "startup_sequence_alignment"
      - target: "config/workspace_usage_guide.md"
        reason: "任务启动流程变更"
        check_kind: "process_step_alignment"

  # ── context-loading.yaml ──
  - source: "config/context-loading.yaml"
    modify_triggers:
      - target: "constraints/baseline/context_intent_gate.yaml"
        reason: "启动序列规则变更"
        check_kind: "startup_sequence_alignment"
      - target: "config/workspace_usage_guide.md"
        reason: "任务启动流程变更"
        check_kind: "process_step_alignment"

  # ── session-tracking.yaml ──
  - source: "config/session-tracking.yaml"
    modify_triggers:
      - target: "docs/user_profile.md"
        reason: "会话历史引用"
        check_kind: "session_reference_sync"

  # ── feature-flags.yaml ──
  - source: "config/feature-flags.yaml"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "功能开关状态变更"
        check_kind: "feature_flag_sync"

  # ── prompts/ 目录 ──
  - source: "prompts/prompt_manifest.yaml"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "Prompt 清单变更"
        check_kind: "prompt_manifest_sync"

  # ── workflows/ 目录 ──
  - source: "workflows/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "工作流注册变更"
        check_kind: "component_list_presence"
      - target: "docs/INDEX.md"
        reason: "工作流数量变更"
        check_kind: "directory_structure_sync"

  # ── constraints/ 目录 ──
  - source: "constraints/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "约束注册变更"
        check_kind: "component_list_presence"
      - target: "docs/INDEX.md"
        reason: "约束数量变更"
        check_kind: "directory_structure_sync"

  # ── docs/ 目录 ──
  - source: "docs/"
    modify_triggers:
      - target: "docs/INDEX.md"
        reason: "文档索引变更"
        check_kind: "file_list_presence"

  # ── scripts/ 目录 ──
  - source: "scripts/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "脚本注册变更"
        check_kind: "component_list_presence"

  # ── schemas/ 目录 ──
  - source: "schemas/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "Schema 注册变更"
        check_kind: "schema_list_sync"

  # ── evaluators/ 目录 ──
  - source: "evaluators/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "评估器注册变更"
        check_kind: "component_list_presence"

  # ── lattice/ 目录 ──
  - source: "lattice/"
    modify_triggers:
      - target: "config/active-release.yaml"
        reason: "Lattice 框架注册变更"
        check_kind: "component_list_presence"

  # ── .vscode/mcp.json ──
  - source: ".vscode/mcp.json"
    modify_triggers:
      - target: "config/mcp-tools.yaml"
        reason: "MCP 工具列表变更"
        check_kind: "exact_list_match"
      - target: "config/active-release.yaml"
        reason: "MCP 工具列表变更"
        check_kind: "list_superset_check"

  # ── INDEX.md ──
  - source: "docs/INDEX.md"
    modify_triggers:
      - target: "docs/sync-manifest.yaml"
        reason: "文档索引变更需同步依赖清单"
        check_kind: "file_list_presence"
