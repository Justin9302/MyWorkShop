rubric:
  id: "ideation_convergence_evaluation"
  name: "头脑风暴与观点收敛评估标准"
  version: "0.1.0"
  description: "评估头脑风暴工作流输出的质量，包括发散广度、收敛质量、知识关联度和结构化程度"
  shared_judge_config: "evaluators/rubrics/shared_judge_config.yaml"
  dimensions:
    - id: "divergence_breadth"
      name: "发散广度"
      weight: 0.25
      description: "评估从多个维度生成想法的丰富程度"
      criteria:
        - "是否覆盖了至少 5 个不同的思考维度"
        - "每个维度是否提供了 3 个以上的具体想法"
        - "想法之间是否有差异性，而非同义反复"
        - "是否包含跨界的、非显而易见的观点"
      scoring:
        5: "覆盖 7+ 维度，每维度 5+ 个差异化想法，包含多个跨界创新观点"
        4: "覆盖 5-6 维度，每维度 3-4 个想法，有一定差异性"
        3: "覆盖 3-4 维度，每维度 2-3 个想法，差异性一般"
        2: "覆盖 2 个维度以下，想法数量少且同质化"
        1: "几乎没有发散，仅围绕单一维度展开"

    - id: "knowledge_relevance"
      name: "知识关联度"
      weight: 0.20
      description: "评估关联的知识、案例、数据是否相关且有价值"
      criteria:
        - "是否检索了与主题相关的行业知识或案例"
        - "引用的资料是否标注了来源"
        - "知识关联是否帮助拓展了思维边界"
        - "是否区分了事实、推断和假设"
      scoring:
        5: "关联了丰富的行业知识、案例和数据，全部标注来源，显著拓展了思维"
        4: "关联了相关知识，大部分标注来源，对思维拓展有帮助"
        3: "有一定知识关联，但深度或广度不足"
        2: "知识关联较少，或未标注来源"
        1: "几乎没有知识关联"

    - id: "clustering_quality"
      name: "聚类与模式识别质量"
      weight: 0.20
      description: "评估观点聚类、模式识别和空白区域发现的准确性"
      criteria:
        - "聚类是否合理且有逻辑性"
        - "是否识别了跨维度的模式和关联"
        - "是否发现了观点之间的冲突点"
        - "是否标记了未被充分探索的空白区域"
      scoring:
        5: "聚类精准，识别了多个跨维度模式和冲突点，清晰标记了空白区域"
        4: "聚类合理，识别了部分模式和冲突点"
        3: "聚类基本合理，但模式识别较浅"
        2: "聚类混乱或缺乏逻辑性"
        1: "没有进行有效的聚类"

    - id: "convergence_quality"
      name: "收敛质量"
      weight: 0.25
      description: "评估基于标准的评估、排序和筛选的合理性"
      criteria:
        - "是否基于明确的收敛标准进行评分"
        - "评分是否合理且有区分度"
        - "排序结果是否清晰可理解"
        - "最终推荐是否有充分的决策依据"
      scoring:
        5: "基于多维度标准评分，区分度好，排序清晰，推荐有充分依据"
        4: "基于标准评分，区分度较好，推荐有依据"
        3: "有评分但标准不够明确，区分度一般"
        2: "评分随意或缺乏标准，推荐缺乏依据"
        1: "没有进行有效的收敛评估"

    - id: "actionability"
      name: "可操作性"
      weight: 0.10
      description: "评估输出是否包含可操作的行动建议"
      criteria:
        - "是否提供了具体的下一步行动"
        - "行动建议是否与收敛结论一致"
        - "是否建议了后续可用的工作流"
        - "是否标记了需要验证的假设"
      scoring:
        5: "提供了具体的、可执行的行动建议，关联了后续工作流，标记了待验证假设"
        4: "提供了行动建议，部分可执行"
        3: "有行动建议但不够具体"
        2: "行动建议模糊或不可执行"
        1: "没有行动建议"

  overall_scoring:
    formula: "weighted_average"
    thresholds:
      excellent: 4.5
      good: 3.5
      fair: 2.5
      poor: 0
