rule_pack:
  id: "citation_check"
  version: "0.1.0"
  status: "draft"
  description: "Evaluates whether factual claims in workflow outputs are properly cited and distinguishable from model inference."
checks:
  - id: "claims_have_sources"
    severity: "medium"
    description: "Each factual claim derived from external material has a corresponding source reference."
    check_type: "field_presence"
    target_field: "output_summary.cited_sources"
  - id: "fact_vs_inference_separated"
    severity: "high"
    description: "Outputs clearly distinguish cited facts from model inference, assumptions, and recommendations."
    check_type: "field_presence"
    target_field: "output_summary.structured_output"
  - id: "citation_metadata_complete"
    severity: "low"
    description: "Citations include source URL, effective date, authority level, and confidentiality classification where available."
    check_type: "field_completeness"
    target_field: "retrieved_sources[*].metadata"
  - id: "internal_only_not_quoted"
    severity: "high"
    description: "Material marked internal-only or non-citable is summarized, not directly quoted."
    check_type: "rule_compliance"
    constraint_id: "respect_citation_permission"
