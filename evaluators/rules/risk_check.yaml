rule_pack:
  id: "risk_check"
  version: "0.1.0"
  status: "draft"
  description: "Evaluates whether workflow outputs correctly identify and classify risks, and whether high-risk outputs are flagged for human review."
checks:
  - id: "risk_classification_present"
    severity: "high"
    description: "High-risk workflows include a risk assessment or classification in their output."
    check_type: "field_presence"
    target_field: "output_summary.risk_assessment"
  - id: "risk_matches_workflow_level"
    severity: "medium"
    description: "Identified risks are consistent with the workflow's declared risk level."
    check_type: "consistency_check"
    compare_fields:
      - "workflow_risk"
      - "output_summary.risk_assessment.level"
  - id: "high_risk_triggers_review"
    severity: "critical"
    description: "High or critical risk outputs have a corresponding human review record in the run snapshot."
    check_type: "conditional_presence"
    condition_field: "output_summary.risk_assessment.level"
    condition_values: ["high", "critical"]
    target_field: "human_review.review_status"
  - id: "evidence_gap_flagged"
    severity: "medium"
    description: "Missing or insufficient evidence for risk-related claims is explicitly noted."
    check_type: "field_presence"
    target_field: "output_summary.evidence_gaps"
