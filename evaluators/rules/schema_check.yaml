rule_pack:
  id: "schema_check"
  version: "0.1.0"
  status: "draft"
  description: "Validates workflow output structure against the workflow's output schema and the run_snapshot schema."
checks:
  - id: "run_snapshot_schema_conformant"
    severity: "critical"
    description: "The run snapshot conforms to schemas/run_snapshot.schema.json."
    check_type: "json_schema_validation"
    schema_ref: "schemas/run_snapshot.schema.json"
  - id: "workflow_output_complete"
    severity: "high"
    description: "All required output fields defined in the workflow YAML are present in the output."
    check_type: "field_presence"
    target_field: "output_summary.structured_output"
  - id: "required_metadata_present"
    severity: "medium"
    description: "Run snapshot includes versions, timestamps, workflow state, and context gate records."
    check_type: "field_presence"
    target_field: "versions"
  - id: "interruption_events_structured"
    severity: "medium"
    description: "Interruption events follow schemas/interruption_event.schema.json structure."
    check_type: "json_schema_validation"
    schema_ref: "schemas/interruption_event.schema.json"
