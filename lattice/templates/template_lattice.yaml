# =============================================================================
# LatticeWork 晶格方案模板
# 用途: 定义顶层晶格方案，包含意图、层级分解、依赖关系和执行策略
# 人类可读: 使用自然语言描述目标和验收标准
# AI可执行: 使用结构化字段定义层级、任务、依赖和执行顺序
# =============================================================================

lattice:
  id: "lattice_<domain>_<id>"          # 唯一标识，如 lattice_quant_001
  name: "<方案名称>"                     # 如 "澳元利率基差套利策略"
  domain: "<domain>"                    # quantitative_trading | software_design | business_model
  domain_type: "<type>"                 # algorithm_design | architecture_design | business_model_validation
  version: "1.0.0"
  description: "<方案描述>"
  created_at: "<ISO 8601时间戳>"
  updated_at: "<ISO 8601时间戳>"

# ── 意图定义 ──────────────────────────────────────────────────────────────
intent:
  user_goal: >
    <用户原始目标描述>
    例如: "设计并验证一个澳元利率基差套利策略，使用三次样条插值构建收益率曲线"

  acceptance_criteria:
    - "<验收标准1>"
    - "<验收标准2>"
    - "<验收标准3>"

  non_goals:
    - "<明确不做的事项1>"
    - "<明确不做的事项2>"

  constraints:
    - "<约束条件1>"
    - "<约束条件2>"

  risk_level: "medium"                  # low | medium | high | critical

# ── 层级分解 ──────────────────────────────────────────────────────────────
# 层级编号规则:
#   Layer N (最内层) = 核心领域模型 / 基础算法
#   Layer 0 (最外层) = 界面 / 管道 / 配置
#   构建顺序: Layer N → Layer N-1 → ... → Layer 0
layers:
  - layer: 4                            # 最内层: 核心领域模型
    name: "核心算法层"
    description: "收益率曲线构建、插值、基差计算等核心算法"
    tasks:
      - task_id: "task_0001"
        name: "收益率曲线插值算法"
        description: "实现三次样条和Catmull-Rom插值"
        depends_on: []                  # 核心层无依赖
      - task_id: "task_0002"
        name: "基差计算引擎"
        description: "计算不同期限/品种间的基差"
        depends_on: ["task_0001"]       # 依赖插值算法
      - task_id: "task_0003"
        name: "现金流折现模型"
        description: "DCF计算引擎"
        depends_on: ["task_0001"]

    assembly_test:
      name: "核心层组装测试"
      description: "验证核心层所有组件能否协同工作"
      tests:
        - "收益率曲线构建 → 插值 → 基差计算 → 输出定价矩阵"
        - "端点情况: 30年曲线上存在数据空隙"
        - "性能: 批量1000次插值 < 100ms"

  - layer: 3
    name: "策略引擎层"
    description: "套利策略逻辑、信号生成、风险管理"
    tasks:
      - task_id: "task_0004"
        name: "基差均值回归检测器"
        description: "检测基差是否偏离均值并生成交易信号"
        depends_on: ["task_0002"]
      - task_id: "task_0005"
        name: "头寸规模算法"
        description: "基于Kelly Criterion计算最优头寸"
        depends_on: []
      - task_id: "task_0006"
        name: "风险管理器"
        description: "VaR计算、止损逻辑、风险限额管理"
        depends_on: ["task_0003"]

    assembly_test:
      name: "策略引擎层组装测试"
      description: "验证策略逻辑与核心层的集成"
      tests:
        - "信号生成 → 头寸计算 → 风险检查 → 交易决策"
        - "回测: 2018-2023年历史数据上的夏普比率 > 1.5"

  - layer: 2
    name: "交易执行层"
    description: "订单路由、执行逻辑、成本分析"
    tasks:
      - task_id: "task_0007"
        name: "订单类型适配器"
        description: "支持Market/Limit/Iceberg订单"
        depends_on: []
      - task_id: "task_0008"
        name: "执行成本分析"
        description: "滑点模型和交易成本估算"
        depends_on: []

    assembly_test:
      name: "交易执行层组装测试"
      description: "验证订单路由和执行逻辑"
      tests:
        - "订单生成 → 路由选择 → 执行报告"
        - "滑点估算与市场冲击模型一致性"

  - layer: 1
    name: "回测验证层"
    description: "历史数据回放、P&L归因、绩效指标"
    tasks:
      - task_id: "task_0009"
        name: "历史数据回放器"
        description: "按时间顺序回放历史市场数据"
        depends_on: []
      - task_id: "task_0010"
        name: "P&L归因分析"
        description: "将盈亏分解到各个策略和风险因子"
        depends_on: ["task_0006"]
      - task_id: "task_0011"
        name: "绩效指标计算"
        description: "夏普/索提诺/卡玛比率计算"
        depends_on: []

    assembly_test:
      name: "回测验证层组装测试"
      description: "验证回测引擎的完整性和准确性"
      tests:
        - "回放 → 策略执行 → P&L计算 → 绩效报告"
        - "与已知基准策略的对比验证"

  - layer: 0
    name: "界面与配置层"
    description: "策略配置、可视化Dashboard、API接口"
    tasks:
      - task_id: "task_0012"
        name: "策略配置Schema"
        description: "YAML配置文件定义和验证"
        depends_on: []
      - task_id: "task_0013"
        name: "实时Dashboard"
        description: "策略状态和绩效可视化"
        depends_on: ["task_0011"]

    assembly_test:
      name: "界面层组装测试"
      description: "验证用户交互和配置加载"
      tests:
        - "配置加载 → 策略初始化 → Dashboard显示"
        - "配置错误检测和用户提示"

# ── 执行策略 ──────────────────────────────────────────────────────────────
execution_strategy:
  direction: "bottom_up"                # 从核心层到外层
  pcdca_required: true                  # 强制PCDCA循环
  max_pcdca_cycles_per_task: 5          # 每个任务最多5次循环
  human_in_the_loop:
    plan_review_required: true          # Plan阶段需要人工审核
    check_review_required: false        # Check阶段自动审核（低风险）
    blocker_escalation: true            # 阻塞点升级到人工

# ── 全局阻塞点 ────────────────────────────────────────────────────────────
global_blockers:
  known: []
  # - id: "blocker_001"
  #   description: "需要Bloomberg API访问权限"
  #   affected_tasks: ["task_0009"]
  #   resolution: "使用本地缓存的历史数据替代"
